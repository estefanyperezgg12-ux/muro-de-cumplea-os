<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro de Cumpleaños</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { text-align: center; color: #d81b60; text-shadow: 2px 2px 4px rgba(255,255,255,0.8); }
        .caja-input {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 100px;
            border: 2px dashed #f06292;
            border-radius: 10px;
            padding: 10px;
            resize: none;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff9fa;
        }
        button {
            background-color: #f06292;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover { background-color: #d81b60; transform: scale(1.02); }
        .nota {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-left: 8px solid #ffb300;
            word-wrap: break-word;
        }
        .nota-fecha { font-size: 12px; color: #888; margin-top: 10px; text-align: right; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body>

    <h1>🎈 ¡Feliz Cumpleaños! 🎂</h1>
    <p style="text-align: center; color: #555;">Déjame un mensaje bonito para celebrar este día.</p>
    
    <div class="caja-input">
        <textarea id="textoNota" placeholder="Escribe tu felicitación aquí..."></textarea>
        <button onclick="guardarNota()">Enviar Felicitación 🎁</button>
    </div>

    <div id="contenedorNotas"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tu nueva configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCYBtuKztoaqJ9cedlVRPTzKztQDt-ePro",
            authDomain: "muro-cumpleanos.firebaseapp.com",
            projectId: "muro-cumpleanos",
            storageBucket: "muro-cumpleanos.firebasestorage.app",
            messagingSenderId: "792024178281",
            appId: "1:792024178281:web:32ca78245a169f11184cf8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const coleccionMensajes = collection(db, "felicitaciones");

        window.guardarNota = async function() {
            const texto = document.getElementById("textoNota").value;
            if (texto.trim() === "") {
                alert("¡Escribe un mensaje antes de enviar!");
                return;
            }

            try {
                await addDoc(coleccionMensajes, {
                    texto: texto,
                    fecha: new Date().toLocaleString()
                });
                document.getElementById("textoNota").value = ""; 
            } catch (e) {
                console.error("Error al guardar: ", e);
                alert("Hubo un error. Revisa la consola.");
            }
        }

        const q = query(coleccionMensajes, orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const contenedor = document.getElementById("contenedorNotas");
            contenedor.innerHTML = ""; 

            snapshot.forEach((doc) => {
                const nota = doc.data();
                contenedor.innerHTML += `
                    <div class="nota">
                        <p>${nota.texto}</p>
                        <div class="nota-fecha">Enviado el: ${nota.fecha}</div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
